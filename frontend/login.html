<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - PBRMS</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-dark navbar-pbrms">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/index.html">
                <i class="bi bi-bicycle brand-icon fs-3"></i>
                <span>PBRMS</span>
            </a>
            <a href="/register.html" class="btn btn-outline-light btn-sm">Create Account</a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <div class="d-inline-flex align-items-center justify-content-center bg-light text-primary rounded-circle mb-3" style="width: 60px; height: 60px;">
                                <i class="bi bi-person-lock fs-2"></i>
                            </div>
                            <h3 class="fw-bold">Sign In to PBRMS</h3>
                            <p class="text-muted small">Access your Customer, Rental Owner, or Admin dashboard</p>
                        </div>

                        <!-- Alert Container -->
                        <div id="alertContainer"></div>

                        <!-- Quick Demo Accounts Helper -->
                        <div class="alert alert-info py-2 px-3 mb-4 small">
                            <div class="fw-bold mb-1"><i class="bi bi-magic me-1"></i>Quick Demo Login:</div>
                            <div class="d-flex flex-wrap gap-1">
                                <button type="button" class="btn btn-outline-dark btn-sm demo-btn" onclick="fillDemoLogin('admin')">
                                    <i class="bi bi-shield-lock me-1"></i>Admin
                                </button>
                                <button type="button" class="btn btn-outline-primary btn-sm demo-btn" onclick="fillDemoLogin('user')">
                                    <i class="bi bi-person me-1"></i>Customer
                                </button>
                                <button type="button" class="btn btn-outline-success btn-sm demo-btn" onclick="fillDemoLogin('owner')">
                                    <i class="bi bi-shop me-1"></i>Rental Owner
                                </button>
                            </div>
                        </div>

                        <!-- Login Form -->
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold small">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <div class="d-flex justify-content-between">
                                    <label for="password" class="form-label fw-semibold small">Password</label>
                                </div>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="loginSubmitBtn">
                                Sign In
                            </button>
                        </form>

                        <div class="text-center mt-4 pt-2 border-top">
                            <p class="small text-muted mb-0">
                                Don't have an account? <a href="/register.html" class="fw-semibold text-primary">Register here</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
